pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{ts,js,mjs}"
      run: npx oxlint {staged_files}

    - name: format
      glob: "*.{ts,js,mjs,json,html,css,md,yml,yaml}"
      run: npx oxfmt {staged_files}
      stage_fixed: true

    - name: typecheck
      run: npx tsc --noEmit

    - name: test
      run: npx vitest run
