commit-msg:
  jobs:
    - name: commitlint
      run: bunx commitlint --edit {1}

pre-commit:
  parallel: true
  jobs:
    - name: lint
      glob: "*.{ts,js,mjs}"
      run: bunx oxlint {staged_files}

    - name: format
      glob: "*.{ts,js,mjs,json,html,css,md,yml,yaml}"
      run: bunx oxfmt {staged_files}
      stage_fixed: true

    - name: typecheck
      run: bun run check-types

    - name: test
      run: bun run test
